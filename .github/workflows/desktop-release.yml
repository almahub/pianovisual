name: Desktop Release

on:
  push:
    tags:
      - "v*"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Python for bundled Piano Lab engine
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: npm ci

      - name: Validate tag == package version
        run: |
          node -e "
          const v = require('./package.json').version;
          const tag = process.env.GITHUB_REF_NAME;
          if (tag !== 'v' + v) {
            console.error('Tag/version mismatch: ' + tag + ' != v' + v);
            process.exit(1);
          }
          console.log('Release version OK: ' + tag);
          "

      - name: Build standalone Piano Lab engine
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pyinstaller
          python -m PyInstaller --onefile --clean --name music-to-piano-json --distpath skill/music-to-piano-json/bin --workpath build/piano-engine --specpath build/piano-engine skill/music-to-piano-json/scripts/convert.py
          if (-not (Test-Path "skill/music-to-piano-json/bin/music-to-piano-json.exe")) { throw "Piano Lab engine build failed" }

      - name: Build Windows installer and publish release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run dist:win -- --publish always

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pianovisual-win-dist
          path: dist/**
          if-no-files-found: warn
